<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pegaki | Tech 2D</title>
    <meta name="description" content="Calcule suas médias e simule notas do Tech com o Pegaki, no site Tech 2D." />
    <link rel="icon" type="image/svg+xml" href="/pegaki/favicon.svg" />
    <meta name="theme-color" content="#0a2dc4" />
    <!-- Aplica o tema salvo (ou o do sistema) antes da primeira pintura, para não piscar claro. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("aprovae:theme");
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#161a22");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pegaki/main.tsx"></script>
  </body>
</html>
